name: Bug report
description: armls or armtool does something wrong
labels: [bug]
body:
  - type: textarea
    id: assembly
    attributes:
      label: Assembly
      description: The smallest file that shows the problem.
      render: asm
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `armtool --version` and `clang --version`, and your OS.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform the file is for
      options: [macOS (Darwin), Linux]
    validations:
      required: true
