name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the clang oracle tests; Linux skips them (docs/decisions/0007-testing.md).
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the version pinned in rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The oracle's version, for when its answers differ from a newer clang's.
      - if: runner.os == 'macOS'
        run: xcrun clang --version
      - run: cargo xtask check

  linux-examples:
    # The Linux examples, built with GCC and run on Arm Linux, then linted
    # there, .S preprocessing included (docs/decisions/0038-linux.md).
    name: linux examples (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: make -s --no-print-directory -C examples/linux run > out.txt && diff out.txt examples/linux/expected.txt
      - run: cargo run -q -p arm-cli --bin armtool -- lint examples/linux
